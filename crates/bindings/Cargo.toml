[package]
name = "sayaka-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Versioned read-only native scan and installer bindings for Sayaka"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
sayaka-engine.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
